<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time-Series Insights</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --fg:#1a1a1a; --muted:#6b7280; --line:#e5e7eb; --accent:#1f3864; }
  * { box-sizing: border-box; }
  body { margin:0; padding:2rem 1rem; font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--fg); }
  main { max-width: 820px; margin: 0 auto; }
  h1 { font-size:1.5rem; margin:0 0 .25rem; }
  p.sub { color:var(--muted); margin:0 0 2rem; }
  .card { border:1px solid var(--line); border-radius:10px; padding:1.25rem; margin-bottom:1.25rem; }
  input[type=file] { width:100%; margin-bottom:.75rem; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:.55rem 1.1rem; font-size:.95rem; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  td { padding:.35rem 0; border-bottom:1px solid var(--line); }
  td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  .status { color:var(--muted); font-size:.9rem; min-height:1.2rem; }
  .error { color:#b91c1c; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1>Time-Series Insights</h1>
  <p class="sub">Upload a CSV with a timestamp column and a numeric column.</p>

  <div class="card">
    <input type="file" id="file" accept=".csv">
    <button id="upload">Upload &amp; analyze</button>
    <p class="status" id="status"></p>
  </div>

  <div class="card hidden" id="results">
    <canvas id="chart" height="120"></canvas>
    <table id="summary"></table>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let chart = null;

function say(msg, isError) {
  $("status").textContent = msg;
  $("status").className = isError ? "status error" : "status";
}

async function analyze() {
  const file = $("file").files[0];
  if (!file) return say("Pick a CSV file first.", true);

  $("upload").disabled = true;
  say("Uploading…");

  try {
    const form = new FormData();
    form.append("file", file);

    const res = await fetch("/datasets", { method: "POST", body: form });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || "upload failed");

    const id = body.dataset.id;
    const [summary, points, anomalies] = await Promise.all([
      fetch(`/datasets/${id}/summary`).then(r => r.json()),
      fetch(`/datasets/${id}/points?limit=2000`).then(r => r.json()),
      fetch(`/datasets/${id}/anomalies`).then(r => r.json())
    ]);

    render(summary, points, anomalies, body);
    say(`${body.accepted} rows accepted, ${body.rejected} rejected.`);
  } catch (err) {
    say(err.message, true);
  } finally {
    $("upload").disabled = false;
  }
}

function render(summary, points, anomalies, report) {
  $("results").classList.remove("hidden");

  const rows = [
    ["Rows accepted", report.accepted],
    ["Rows rejected", report.rejected],
    ["Min", summary.min.toFixed(2)],
    ["Max", summary.max.toFixed(2)],
    ["Mean", summary.mean.toFixed(2)],
    ["Median", summary.median.toFixed(2)],
    ["Std. deviation", summary.stdev.toFixed(2)],
    ["Anomalies (z ≥ 3)", anomalies.count]
  ];
  $("summary").innerHTML = rows
    .map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`)
    .join("");

  const flagged = new Set(anomalies.anomalies.map(a => a.ts));
  if (chart) chart.destroy();
  chart = new Chart($("chart"), {
    type: "line",
    data: {
      labels: points.map(p => p.ts.slice(0, 16).replace("T", " ")),
      datasets: [{
        data: points.map(p => p.value),
        borderColor: "#1f3864",
        borderWidth: 1.5,
        pointRadius: points.map(p => flagged.has(p.ts) ? 4 : 0),
        pointBackgroundColor: "#dc2626",
        tension: 0.15
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: { x: { ticks: { maxTicksLimit: 8 } } }
    }
  });
}

$("upload").addEventListener("click", analyze);
</script>
</body>
</html>
